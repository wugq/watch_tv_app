name: tv
description: Watch your live stream channels.

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.1.0+2

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  crypto: ^3.0.7
  get: ^4.7.3
  path: ^1.9.1
  sqflite: ^2.4.4+1
  video_player: ^2.14.1
  wakelock_plus: ^1.8.1
  file_picker: ^13.1.0
  http: ^1.6.0
  video_player_media_kit: ^2.0.0
  media_kit_libs_windows_video: ^1.0.11
  media_kit_libs_linux: ^1.2.1
  window_manager: ^0.5.2
  path_provider: ^2.1.6
  sqflite_common_ffi: ^2.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  windows:
    generate: true
    image_path: "assets/icon/logo.png"
  macos:
    generate: true
    image_path: "assets/icon/logo.png"
  image_path: "assets/icon/logo.png"
